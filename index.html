<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Weather Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video autoplay loop muted playsinline id="bg-video">
        <source src="rain.mp4.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <main class="app-container">
        
        <section class="weather-section glass">
            <header>
                <div class="logo">
                    <i class="fa-solid fa-cloud-sun"></i> Atmos
                </div>
                
                <form id="search-form" class="search-bar">
                    <input type="text" id="search-input" placeholder="Search any city..." autocomplete="off">
                    <button type="submit"><i class="fa-solid fa-search"></i></button>
                </form>
            </header>

            <div class="suggested-cities" id="suggested-cities">
                </div>

            <div id="loader" class="hidden">Fetching atmosphere data...</div>
            <div id="error-msg" class="hidden">City not found. Please try again.</div>

            <div id="weather-display" class="weather-main hidden fade-in">
                <div class="weather-header">
                    <h1 id="city-name">Tokyo, JP</h1>
                    <p id="local-time">Mon, 10:30 AM</p>
                </div>

                <div class="temp-container">
                    <img id="weather-icon" src="" alt="Weather Icon" class="main-icon">
                    <h2 id="temperature">28</h2>
                    <div class="unit-toggle">
                        <button id="btn-c" class="active">°C</button>
                        <span>|</span>
                        <button id="btn-f">°F</button>
                    </div>
                </div>
                
                <h3 id="condition">Partly Cloudy</h3>

                <div class="weather-details">
                    <div class="detail glass-sm">
                        <i class="fa-solid fa-droplet"></i>
                        <div>
                            <p>Humidity</p>
                            <span id="humidity">65%</span>
                        </div>
                    </div>
                    <div class="detail glass-sm">
                        <i class="fa-solid fa-wind"></i>
                        <div>
                            <p>Wind Speed</p>
                            <span id="wind-speed">12 km/h</span>
                        </div>
                    </div>
                    <div class="detail glass-sm">
                        <i class="fa-solid fa-sun"></i>
                        <div>
                            <p>Sunrise</p>
                            <span id="sunrise">05:30 AM</span>
                        </div>
                    </div>
                </div>

                <div class="hourly-forecast">
                    <h4>Next Hours</h4>
                    <div class="forecast-container" id="forecast-container">
                        </div>
                </div>
            </div>
        </section>

        <aside class="news-section glass">
            <h2><i class="fa-solid fa-newspaper"></i> Climate News</h2>
            <div class="news-container" id="news-container">
                <p class="loading-news">Loading latest news...</p>
                </div>
        </aside>

    </main>

    <script src="script.js"></script>
</body>
</html>
